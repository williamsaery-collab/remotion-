name: Verify and export video
on:
  push:
    paths: ['src/**', 'public/**', 'scripts/**', 'tests/**', 'package*.json', 'tsconfig.json', '.github/workflows/video.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      composition:
        description: Video to export
        type: choice
        default: Preview20
        options: [Preview20, Opening15, LTOOfficer]
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx remotion browser ensure
      - run: npm run verify:frames
      - if: github.event_name == 'workflow_dispatch'
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: npx remotion render src/index.ts "$COMPOSITION" "out/$COMPOSITION.mp4" --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: mijori-video
          path: out/
          retention-days: 14
